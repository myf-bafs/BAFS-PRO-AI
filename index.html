<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>BAFS 地獄救星 - AI 筆記助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ind:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'}}}}}</script>
<style>
*{scrollbar-width:thin}::selection{background:#4f46e5;color:#fff}
body{font-family:'Noto Sans TC',sans-serif;background:#f8fafc}
#chatBox{height:calc(100vh - 260px);overflow-y:auto;scroll-behavior:smooth}
.msg-user{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:1.25rem 1.25rem .25rem 1.25rem;max-width:85%;align-self:flex-end}
.msg-ai{background:#fff;border:1px solid #e2e8f0;border-radius:1.25rem 1.25rem 1.25rem .25rem;max-width:92%}
.msg-ai p{margin:.5rem 0;line-height:1.7}
.topic-tag{display:inline-block;background:#eef2ff;color:#4338ca;font-size:.65rem;font-weight:900;padding:.1rem .5rem;border-radius:999px;margin:.1rem .15rem}
.typing-dot{width:8px;height:8px;border-radius:50%;background:#6366f1;display:inline-block;animation:tb 1.4s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.opt-btn{font-size:.75rem;background:#eef2ff;color:#4338ca;padding:.35rem .8rem;border-radius:999px;font-weight:700;cursor:pointer;border:1px solid #c7d2fe}
.opt-btn:hover{background:#c7d2fe}
.tab-btn.on{border-color:#4f46e5;color:#4f46e5}
</style>
</head>
<body>
<nav class="bg-gradient-to-r from-indigo-800 to-purple-800 px-3 py-2.5 flex items-center justify-between sticky top-0 z-50 text-white">
  <div class="flex items-center gap-2">
    <a href="https://myf-swcs.free.nf/" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition font-bold text-sm">🏠</a>
    <span class="font-black text-sm md:text-base">🤖 BAFS 地獄救星</span>
  </div>
  <button onclick="toggleMode()" id="modeToggle" class="text-xs font-bold px-2 py-1 rounded-lg bg-orange-500/30 hover:bg-orange-500/50 transition">🔥 地獄 mode</button>
</nav>

<div class="bg-white border-b border-slate-200 sticky top-[53px] z-40">
  <div class="max-w-3xl mx-auto flex">
    <button onclick="switchTab('chat',this)" class="tab-btn on flex-1 py-3 text-center text-xs md:text-sm font-black border-b-2 border-transparent text-slate-400">💬 問問題</button>
    <button onclick="switchTab('quiz',this)" class="tab-btn flex-1 py-3 text-center text-xs md:text-sm font-black border-b-2 border-transparent text-slate-400">🎲 隨機練習</button>
  </div>
</div>

<!-- 問問題 -->
<div id="tab-chat" class="max-w-3xl mx-auto px-3">
  <div id="chatBox" class="flex flex-col gap-3 py-4"></div>
  <div id="chatLoading" class="hidden items-center gap-2 px-4 py-2"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span><span class="text-xs text-slate-400 ml-2">思考中...</span></div>
  <div id="chatErr" class="hidden mx-3 my-2 p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-700 text-xs font-bold"></div>
  <div class="fixed bottom-0 left-0 right-0 p-3 z-40 bg-white border-t border-slate-200">
    <div class="max-w-3xl mx-auto flex gap-2">
      <input id="qInput" type="text" class="flex-1 px-4 py-3 rounded-xl border border-slate-300 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="輸入 BAFS 問題..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="newChat()" class="px-3 py-3 rounded-xl bg-slate-200 font-bold text-xs" title="新對話">🆕</button>
      <button id="sendBtn" onclick="send()" class="px-5 py-3 rounded-xl bg-indigo-600 text-white font-black text-sm">傳送 ➤</button>
    </div>
    <p class="text-center text-[10px] text-slate-400 mt-1.5">基於筆記內容回答 · 由 GLM 提供</p>
  </div>
</div>

<!-- 隨機練習 -->
<div id="tab-quiz" class="hidden max-w-3xl mx-auto px-3 py-4">
  <div class="bg-white rounded-2xl p-5 shadow-sm border">
    <h3 class="font-black mb-3">🎲 題庫練習</h3>
    <div id="quizCard"><p class="text-slate-400 text-sm text-center py-6">揀下面「下一題」開始</p></div>
    <button onclick="loadQuiz()" class="w-full mt-3 bg-indigo-50 text-indigo-600 font-bold py-2.5 rounded-xl text-sm">🔄 下一題</button>
    <div id="quizLoading" class="hidden items-center gap-2 px-4 py-2 mt-2"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
    <div id="quizResult" class="hidden mt-3 p-4 rounded-xl bg-slate-50 border text-sm"></div>
  </div>
</div>

<script src="notes_data.js"></script>
<script src="quiz_data.js"></script>
<script>
window.onerror = function(msg, src, line) {
    var el = document.getElementById('chatErr');
    if (el) { el.textContent = '⚠️ 系統錯誤（請截圖俾老師）：' + msg + ' @' + line; el.classList.remove('hidden'); }
};

var API_KEY = '';
// 本機 Ollama（需先設定 OLLAMA_ORIGINS=* 並保持 ollama serve 運行）
var ENDPOINT = 'http://127.0.0.1:11434/v1/chat/completions';
var MODEL = 'gemma2:2b';

var mode = 'savage', hints = 0, expect = 'new', busy = false, chat = [], seenKeys = [];
try { if (localStorage.getItem('bafs_mode') === 'gentle') mode = 'gentle'; } catch(e) {}

function $(id){ return document.getElementById(id); }
function esc(t){ var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
function toggleMode(){ mode = mode === 'savage' ? 'gentle' : 'savage'; try { localStorage.setItem('bafs_mode', mode); } catch(e){} paintMode(); }
function paintMode(){
    var b = $('modeToggle');
    if (!b) return;
    if (mode === 'gentle') { b.textContent = '☺️ 溫柔 mode'; b.className = 'text-xs font-bold px-2 py-1 rounded-lg bg-pink-500/30 hover:bg-pink-500/50 transition'; }
    else { b.textContent = '🔥 地獄 mode'; b.className = 'text-xs font-bold px-2 py-1 rounded-lg bg-orange-500/30 hover:bg-orange-500/50 transition'; }
}
function switchTab(name, btn){
    ['chat','quiz'].forEach(function(t){ $('tab-'+t).classList.add('hidden'); });
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); b.classList.add('text-slate-400'); });
    $('tab-'+name).classList.remove('hidden');
    if (btn) { btn.classList.add('on'); btn.classList.remove('text-slate-400'); }
}

/* ---------- 引導式問答 ---------- */
var TONE_SAVAGE = '你係香港 BAFS 補習老師「地獄救星」。語氣：極度直接串得，但教學認真，每個回應至少一個爛gag（唔准夾 BAFS 術語）。';
var TONE_GENTLE = '你係香港 BAFS 補習老師「地獄救星」。語氣：溫柔鼓勵，多啲「加油～」。';
var RULES = '【鐵則】\n1. 所有 BAFS 概念/定義/術語/例子，必須逐字引用【筆記內容】原文，一字不改，唔准自己改寫或用同義詞。\n2. 筆記冇嘅概念，答「呢個筆記冇教，問返老師啦」，唔准自己作。\n3. 引導式教學：唔好直接畀答案，出一條引導問題等學生諗。收到【指示】就一定跟。\n4. 用口語化粵語，短答（150字內，畀完整答案嗰陣可以長）。粗口用*代替。\n5. 只可以輸出 JSON（唔好 code block）：{"reply":"..." ,"options":["選項1","選項2","💡 諗唔到，畀啲提示","📢 直接睇答案"],"done":false}\n- 學生未答/未要求答案時 done=false；了結一次教學（畀咗完整答案+總結）先 done=true。\n- 選項用筆記字眼組成，似是而非；引導問題同選項唔好重複答案內容。\n6. 問題同 BAFS 無關：寸兩句，叫佢溫 BAFS，done=true。\n7. 引用課題用 [課題編號]，提醒學生去筆記頁面睇返。';

function directive(){
    if (expect === 'hint') return hints >= 2 ? '【指示】學生已第2次要求提示：直接畀完整答案（逐字引用筆記）+一句總結，done=true。'
        : '【指示】第1次提示：拆細問題+畀例子，唔准畀完整答案，done=false。';
    if (expect === 'final') return '【指示】學生要求直接睇答案：直接畀完整答案（逐字引用筆記）+一句總結，done=true。';
    if (expect === 'answer') return '【指示】學生已回應你上一條引導問題：判斷啱定錯，答啱讚+推下一步；答錯指出錯處+問更細步問題，done=false。';
    return '【指示】新問題：只出一條引導問題+選項，嚴禁直接畀答案，done=false。';
}
function searchNotes(q){
    var text = String(NOTES_MD || '');
    var words = q.replace(/[.,!?;:()（）\[\]【】、，。？；：！""]/g, ' ').split(/\s+/).filter(function(w){ return w.length >= 2; }).slice(0, 6);
    var sections = text.split(/### Topic \d+:/);
    var headers = text.match(/### Topic \d+:\s*\S+\s*-\s*.*(?=\n|$)/g) || [];
    var scored = [];
    for (var i = 1; i < sections.length; i++){
        var score = 0;
        for (var w of words){ var re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'); var m = sections[i].match(re); if (m) score += m.length * w.length; }
        if (score > 0){
            var h = (headers[i-1] || '').match(/### Topic (\d+):\s*(\S+)\s*-\s*(.*)/);
            scored.push({ body: sections[i].substring(0, 900), code: h ? h[2] : '', title: h ? h[3] : '', score: score });
        }
    }
    scored.sort(function(a,b){ return b.score - a.score; });
    var best = scored.slice(0, 3);
    var ctx = best.map(function(s){ return '[' + s.code + ' ' + s.title + ']\n' + s.body; }).join('\n\n---\n\n');
    var cited = best.map(function(s){ return s.code + ' ' + s.title; });
    return { ctx: ctx, cited: cited };
}
function pushMsg(role, content, opts){
    // 防重複：同一段 AI 內容只顯示一次
    var key = role + '|' + String(content).replace(/\s+/g, '').slice(0, 300);
    if (role !== 'user') {
        if (seenKeys.indexOf(key) !== -1) return;
        seenKeys.push(key);
    }
    var d = document.createElement('div');
    if (role === 'user') d.className = 'msg-user px-4 py-3 shadow-sm';
    else d.className = 'msg-ai self-start px-4 py-3.5 shadow-sm';
    var inner = role === 'user' ? '<p class="text-sm leading-relaxed">' + esc(content) + '</p>'
        : '<div class="flex items-center gap-2 mb-1"><span>🤖</span><span class="font-black text-sm text-indigo-600">BAFS 地獄救星</span></div><div class="text-sm text-slate-700" style="white-space:pre-wrap">' + mdText(content) + '</div>';
    d.innerHTML = inner;
    var box = $('chatBox');
    box.appendChild(d);
    if (opts && opts.length){
        var row = document.createElement('div');
        row.className = 'flex flex-wrap gap-1.5';
        opts.forEach(function(op){
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'opt-btn'; b.textContent = op;
            b.onclick = function(){ answerOption(op); };
            row.appendChild(b);
        });
        box.appendChild(row);
    }
    box.scrollTop = box.scrollHeight;
}
function mdText(t){
    return esc(t).replace(/\[([A-Z0-9.\-]+)\]/g, '<span class="topic-tag">$1</span>');
}
function answerOption(op){
    if (op.indexOf('諗唔到') !== -1){ hints++; expect = 'hint'; }
    else if (op.indexOf('睇答案') !== -1){ hints = 0; expect = 'final'; }
    else { expect = 'answer'; }
    $('qInput').value = op;
    send();
}
function newChat(){ chat = []; hints = 0; expect = 'new'; seenKeys = []; $('chatBox').innerHTML = ''; welcome(); try { localStorage.removeItem('bafs_chat'); } catch(e){} }
function welcome(){
    pushMsg('ai', '喂喂喂！BAFS 有咩唔明即管問，我唔會即刻開估，會一步步引導你諗。試下問：\n· 什麼是流動資產？\n· 解釋 SMART 目標\n· 損益表和財務狀況表有咩分別？');
}
async function send(){
    var input = $('qInput');
    var q = input.value.trim();
    if (!q || busy) return;
    busy = true; $('sendBtn').disabled = true;
    input.value = '';
    pushMsg('user', q);
    chat.push({ role: 'user', content: q });
    $('chatLoading').classList.remove('hidden'); $('chatLoading').classList.add('flex');
    var dir = directive();
    if (expect !== 'hint') hints = (expect === 'answer') ? hints : 0;
    var sn = searchNotes(q);
    var msgs = [{ role: 'system', content: (mode === 'gentle' ? TONE_GENTLE : TONE_SAVAGE) + '\n\n' + RULES }];
    chat.slice(-6).forEach(function(h){ msgs.push({ role: h.role === 'user' ? 'user' : 'assistant', content: h.content }); });
    msgs.push({ role: 'user', content: (sn.ctx ? '【筆記內容】\n' + sn.ctx + '\n\n' : '') + '【學生問題】' + q + '\n\n' + dir });
    try {
        var res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.3, max_tokens: 2000 }) });
        var data = await res.json();
        if (!res.ok) throw new Error((data.error && (data.error.message || data.error)) || res.statusText);
        var raw = ((data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '').trim();
        var reply = raw, opts = [], done = false;
        var m = raw.match(/\{[\s\S]*\}/);
        if (m){ try { var j = JSON.parse(m[0]); if (j && j.reply){ reply = String(j.reply); done = !!j.done; if (Array.isArray(j.options)) opts = j.options.filter(function(x){ return typeof x === 'string' && x.trim(); }).slice(0, 4); } } catch(e){} }
        if (!opts.length) opts = done ? [] : ['💡 諗唔到，畀啲提示', '📢 直接睇答案'];
        pushMsg('ai', reply, opts);
        chat.push({ role: 'assistant', content: reply });
        if (done){ hints = 0; expect = 'new'; } else expect = 'answer';
        try { localStorage.setItem('bafs_chat', JSON.stringify(chat.slice(-30))); } catch(e){}
    } catch(e){
        var box = $('chatBox');
        var d = document.createElement('div');
        d.className = 'msg-ai self-start px-4 py-3.5 shadow-sm text-sm text-red-500';
        d.textContent = '⚠️ 連線失敗：' + (e.message || '請再試一次');
        box.appendChild(d);
    }
    $('chatLoading').classList.add('hidden'); $('chatLoading').classList.remove('flex');
    busy = false; $('sendBtn').disabled = false;
}

/* ---------- 題庫練習 ---------- */
function loadQuiz(){
    var ids = Object.keys(QUIZ_DATA || {});
    if (!ids.length) return alert('題庫未載入');
    var tid = ids[Math.floor(Math.random() * ids.length)];
    var t = QUIZ_DATA[tid];
    var qs = t.quiz || t.qs || [];
    if (!qs.length) return loadQuiz.retry = (loadQuiz.retry || 0) + 1 < 5 ? loadQuiz() : null;
    var q = qs[Math.floor(Math.random() * qs.length)];
    quizNow = { code: t.code, title: t.title, q: q.q, o: q.o, c: q.c };
    var labels = ['A','B','C','D'];
    var h = '<div class="mb-2"><span class="topic-tag">'+esc(t.code)+'</span> <span class="text-xs text-slate-400">'+esc(t.title)+'</span></div><p class="font-bold mb-2">'+esc(q.q)+'</p><div class="space-y-2">';
    q.o.forEach(function(o,i){ h += '<button onclick="pickQuiz('+i+')" class="w-full text-left p-3 rounded-xl border text-sm font-bold hover:bg-indigo-50">'+labels[i]+'. '+esc(o)+'</button>'; });
    h += '</div>';
    $('quizCard').innerHTML = h;
    $('quizResult').classList.add('hidden');
}
async function pickQuiz(sel){
    if (!quizNow) return;
    document.querySelectorAll('#quizCard button').forEach(function(b,i){ b.disabled = true; if (i === quizNow.c) b.classList.add('bg-green-100','border-green-500'); else if (i === sel) b.classList.add('bg-red-100','border-red-500'); });
    $('quizLoading').classList.remove('hidden'); $('quizLoading').classList.add('flex');
    var sn = searchNotes(quizNow.q);
    var msgs = [
      { role: 'system', content: '你係 BAFS 補習老師，解釋一題 MC 為何答錯/啱。【鐵則】所有 BAFS 概念/定義必須逐字引用【筆記內容】原文；筆記冇就直講「筆記冇教」。口語化粵語，短答。' },
      { role: 'user', content: (sn.ctx ? '【筆記內容】\n' + sn.ctx + '\n\n' : '') + '【題目】'+quizNow.q+'\n【正確】'+quizNow.o[quizNow.c]+'\n【學生揀】'+(quizNow.o[sel]||'') }
    ];
    try {
        var res = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.3, max_tokens: 1500 }) });
        var data = await res.json();
        var fb = data.choices[0].message.content || '正確答案：' + quizNow.c;
        $('quizResult').innerHTML = '<div style="white-space:pre-wrap">' + esc(fb) + '</div>';
        $('quizResult').classList.remove('hidden');
    } catch(e){ $('quizResult').innerHTML = '⚠️ 連線失敗：' + e.message; $('quizResult').classList.remove('hidden'); }
    $('quizLoading').classList.add('hidden'); $('quizLoading').classList.remove('flex');
}
var quizNow = null;

/* ---------- 啟動 ---------- */
paintMode();
try { localStorage.removeItem('bafs_chat'); } catch(e){}
welcome();
if (typeof QUIZ_DATA === 'undefined' || !QUIZ_DATA) window.QUIZ_DATA = {};
</script>
</body>
</html>
