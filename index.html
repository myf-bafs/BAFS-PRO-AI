<script>
window.onerror = function(msg, src, line) {
    var el = document.getElementById('chatErr');
    if (el) { el.textContent = '⚠️ 系統錯誤（請截圖俾老師）：' + msg + ' @' + line; el.classList.remove('hidden'); }
};

var API_KEY = 'eeadc107777b44be96a529da6f3073aa.MMjiigBxXkike7Ew';
var ENDPOINT = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
var MODEL = 'glm-4-flash-250414';
var IMG_ENDPOINT = 'https://apihub.agnes-ai.com/v1/images/generations';
var IMG_MODEL = 'agnes-image-2.1-flash';
var VID_ENDPOINT = 'https://apihub.agnes-ai.com/v1/videos';
var VID_MODEL = 'agnes-video-v2.0';

var mode = 'savage', hints = 0, expect = 'new', busy = false, chat = [];
try { if (localStorage.getItem('bafs_mode') === 'gentle') mode = 'gentle'; } catch(e) {}

function $(id){ return document.getElementById(id); }
function esc(t){ var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
function toggleMode(){ mode = mode === 'savage' ? 'gentle' : 'savage'; try { localStorage.setItem('bafs_mode', mode); } catch(e){} paintMode(); }
function paintMode(){
    var b = $('modeToggle');
    if (!b) return;
    if (mode === 'gentle') { b.textContent = '☺️ 溫柔 mode'; b.className = 'text-xs font-bold px-2 py-1 rounded-lg bg-pink-500/30 hover:bg-pink-500/50 transition'; }
    else { b.textContent = '🔥 地獄 mode'; b.className = 'text-xs font-bold px-2 py-1 rounded-lg bg-orange-500/30 hover:bg-orange-500/50 transition'; }
}
function switchTab(name, btn){
    ['chat','grade','quiz','img','video'].forEach(function(t){ $('tab-'+t).classList.add('hidden'); });
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); b.classList.add('text-slate-400'); });
    $('tab-'+name).classList.remove('hidden');
    if (btn) { btn.classList.add('on'); btn.classList.remove('text-slate-400'); }
    if (name === 'img') buildImgForm(); if (name === 'video') buildVideoForm();
}

/* ---------- 引導式問答 ---------- */
var TONE_SAVAGE = '你係香港 BAFS 補習老師「地獄救星」。語氣：極度直接串得，但教學認真，每個回應至少一個爛gag（唔准夾 BAFS 術語）。';
var TONE_GENTLE = '你係香港 BAFS 補習老師「地獄救星」。語氣：溫柔鼓勵，多啲「加油～」。';
var RULES = '【鐵則】\n1. 所有 BAFS 概念/定義/術語/例子，必須逐字引用【筆記內容】原文，一字不改，唔准自己改寫或用同義詞。\n2. 筆記冇嘅概念，答「呢個筆記冇教，問返老師啦」，唔准自己作。\n3. 引導式教學：唔好直接畀答案，出一條引導問題等學生諗。收到【指示】就一定跟。\n4. 用口語化粵語，短答（150字內，畀完整答案嗰陣可以長）。粗口用*代替。\n5. 只可以輸出 JSON（唔好 code block）：{"reply":"..." ,"options":["選項1","選項2","💡 諗唔到，畀啲提示","📢 直接睇答案"],"done":false}\n- 學生未答/未要求答案時 done=false；了結一次教學（畀咗完整答案+總結）先 done=true。\n- 選項用筆記字眼組成，似是而非；引導問題同選項唔好重複答案內容。\n6. 問題同 BAFS 無關：寸兩句，叫佢溫 BAFS，done=true。\n7. 引用課題用 [課題編號]，提醒學生去筆記頁面睇返。';

function directive(){
    if (expect === 'hint') return hints >= 2 ? '【指示】學生已第2次要求提示：直接畀完整答案（逐字引用筆記）+一句總結，done=true。'
        : '【指示】第1次提示：拆細問題+畀例子，唔准畀完整答案，done=false。';
    if (expect === 'final') return '【指示】學生要求直接睇答案：直接畀完整答案（逐字引用筆記）+一句總結，done=true。';
    if (expect === 'answer') return '【指示】學生已回應你上一條引導問題：判斷啱定錯，答啱讚+推下一步；答錯指出錯處+問更細步問題，done=false。';
    return '【指示】新問題：只出一條引導問題+選項，嚴禁直接畀答案，done=false。';
}
function searchNotes(q){
    var text = String(NOTES_MD || '');
    var words = q.replace(/[.,!?;:()（）\[\]【】、，。？；：！""]/g, ' ').split(/\s+/).filter(function(w){ return w.length >= 2; }).slice(0, 6);
    var sections = text.split(/### Topic \d+:/);
    var headers = text.match(/### Topic \d+:\s*\S+\s*-\s*.*(?=\n|$)/g) || [];
    var scored = [];
    for (var i = 1; i < sections.length; i++){
        var score = 0;
        for (var w of words){ var re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'); var m = sections[i].match(re); if (m) score += m.length * w.length; }
        if (score > 0){
            var h = (headers[i-1] || '').match(/### Topic (\d+):\s*(\S+)\s*-\s*(.*)/);
            scored.push({ body: sections[i].substring(0, 1500), code: h ? h[2] : '', title: h ? h[3] : '', score: score });
        }
    }
    scored.sort(function(a,b){ return b.score - a.score; });
    var best = scored.slice(0, 3);
    var ctx = best.map(function(s){ return '[' + s.code + ' ' + s.title + ']\n' + s.body; }).join('\n\n---\n\n');
    var cited = best.map(function(s){ return s.code + ' ' + s.title; });
    return { ctx: ctx, cited: cited };
}
function pushMsg(role, content, opts){
    var d = document.createElement('div');
    if (role === 'user') d.className = 'msg-user px-4 py-3 shadow-sm';
    else d.className = 'msg-ai self-start px-4 py-3.5 shadow-sm';
    var inner = role === 'user' ? '<p class="text-sm leading-relaxed">' + esc(content) + '</p>'
        : '<div class="flex items-center gap-2 mb-1"><span>🤖</span><span class="font-black text-sm text-indigo-600">BAFS 地獄救星</span></div><div class="text-sm text-slate-700" style="white-space:pre-wrap">' + esc(content) + '</div>' + tagLinks(content);
    d.innerHTML = inner;
    var box = $('chatBox');
    box.appendChild(d);
    if (opts && opts.length){
        var row = document.createElement('div');
        row.className = 'flex flex-wrap gap-1.5';
        opts.forEach(function(op){
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'opt-btn'; b.textContent = op;
            b.onclick = function(){ answerOption(op); };
            row.appendChild(b);
        });
        box.appendChild(row);
    }
    box.scrollTop = box.scrollHeight;
}
function tagLinks(t){
    return String(t).replace(/\[[A-Z0-9.\-]+\]/g, function(m){ return '<span class="topic-tag">' + esc(m) + '</span>'; });
}
function answerOption(op){
    if (op.indexOf('諗唔到') !== -1){ hints++; expect = 'hint'; }
    else if (op.indexOf('睇答案') !== -1){ hints = 0; expect = 'final'; }
    else { expect = 'answer'; }
    $('qInput').value = op;
    send();
}
function newChat(){ chat = []; hints = 0; expect = 'new'; $('chatBox').innerHTML = ''; welcome(); try { localStorage.removeItem('bafs_chat'); } catch(e){} }
function welcome(){
    pushMsg('ai', '喂喂喂！BAFS 有咩唔明即管問，我唔會即刻開估，會一步步引導你諗。試下問：\n· 什麼是流動資產？\n· 解釋 SMART 目標\n· 損益表和財務狀況表有咩分別？');
}
async function send(){
    var input = $('qInput');
    var q = input.value.trim();
    if (!q || busy) return;
    busy = true; $('sendBtn').disabled = true;
    input.value = '';
    pushMsg('user', q);
    chat.push({ role: 'user', content: q });
    $('chatLoading').classList.remove('hidden'); $('chatLoading').classList.add('flex');
    var dir = directive();
    if (expect !== 'hint') hints = (expect === 'answer') ? hints : 0;
    var sn = searchNotes(q);
    var msgs = [{ role: 'system', content: (mode === 'gentle' ? TONE_GENTLE : TONE_SAVAGE) + '\n\n' + RULES }];
    chat.slice(-6).forEach(function(h){ msgs.push({ role: h.role === 'user' ? 'user' : 'assistant', content: h.content }); });
    msgs.push({ role: 'user', content: (sn.ctx ? '【筆記內容】\n' + sn.ctx + '\n\n' : '') + '【學生問題】' + q + '\n\n' + dir });
    try {
        var res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY }, body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.3, max_tokens: 900 }) });
        var data = await res.json();
        if (!res.ok) throw new Error((data.error && (data.error.message || data.error)) || res.statusText);
        var raw = ((data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '').trim();
        var reply = raw, opts = [], done = false;
        var m = raw.match(/\{[\s\S]*\}/);
        if (m){ try { var j = JSON.parse(m[0]); if (j && j.reply){ reply = String(j.reply); done = !!j.done; if (Array.isArray(j.options)) opts = j.options.filter(function(x){ return typeof x === 'string' && x.trim(); }).slice(0, 4); } } catch(e){} }
        if (!opts.length) opts = done ? [] : ['💡 諗唔到，畀啲提示', '📢 直接睇答案'];
        pushMsg('ai', reply, opts);
        chat.push({ role: 'assistant', content: reply });
        if (done){ hints = 0; expect = 'new'; } else expect = 'answer';
        try { localStorage.setItem('bafs_chat', JSON.stringify(chat.slice(-30))); } catch(e){}
    } catch(e){
        var box = $('chatBox');
        var d = document.createElement('div');
        d.className = 'msg-ai self-start px-4 py-3.5 shadow-sm text-sm text-red-500';
        d.textContent = '⚠️ 連線失敗：' + (e.message || '請再試一次');
        box.appendChild(d);
    }
    $('chatLoading').classList.add('hidden'); $('chatLoading').classList.remove('flex');
    busy = false; $('sendBtn').disabled = false;
}
function restoreChat(){
    try {
        var s = localStorage.getItem('bafs_chat');
        if (!s) return false;
        var arr = JSON.parse(s);
        if (!Array.isArray(arr) || !arr.length) return false;
        arr.forEach(function(h){ pushMsg(h.role === 'user' ? 'user' : 'ai', h.content); });
        chat = arr; expect = 'answer';
        return true;
    } catch(e){ return false; }
}

/* ---------- 功課批改 ---------- */
buildGradeForm = function(){
    if ($('gradeForm').dataset.done) return; $('gradeForm').dataset.done = 1;
    $('gradeForm').innerHTML =
      '<label class="text-xs font-bold text-slate-500 mb-1 block">題目</label><textarea id="gw" rows="3" class="w-full px-3 py-2.5 rounded-xl border text-sm"></textarea>' +
      '<label class="text-xs font-bold text-slate-500 mb-1 mt-2 block">你的答案</label><textarea id="ga" rows="4" class="w-full px-3 py-2.5 rounded-xl border text-sm"></textarea>' +
      '<button onclick="doGrade()" id="gradeBtn" class="w-full bg-indigo-600 text-white font-black py-3 rounded-xl mt-3">📤 提交批改</button>' +
      '<div id="gradeLoad" class="hidden items-center gap-2 px-4 py-2 mt-2"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
};
async function doGrade(){
    var q = $('gw').value.trim(), a = $('ga').value.trim();
    if (!q || !a) return alert('請填寫題目及答案');
    $('gradeBtn').disabled = true; $('gradeLoad').classList.remove('hidden'); $('gradeLoad').classList.add('flex');
    var sn = searchNotes(q + ' ' + a);
    var msgs = [
      { role: 'system', content: (mode === 'gentle' ? TONE_GENTLE : TONE_SAVAGE) + ' 任務：評分（X/10）、引筆記字眼講評、畀參考答案。\n【鐵則】所有 BAFS 概念/定義/參考答案必須逐字引用【筆記內容】原文，筆記冇覆蓋就註明「筆記冇覆蓋」，唔准自創。先俾分數，再 Point→定義→應用 結構講評。' },
      { role: 'user', content: (sn.ctx ? '【筆記內容】\n' + sn.ctx + '\n\n' : '') + '【題目】' + q + '\n【學生答案】' + a }
    ];
    try {
        var res = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+API_KEY }, body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.3, max_tokens: 2048 }) });
        var data = await res.json();
        if (!res.ok) throw new Error(res.statusText);
        var out = (data.choices[0].message.content || '⚠️ 無回覆');
        var sm = out.match(/(\d+)\s*\/\s*10/);
        $('gradeResult').innerHTML = (sm ? '<div class="font-black text-lg mb-2 '+(+sm[1] >= 7?'text-emerald-600':'text-amber-600')+'">'+sm[1]+ ' / 10</div>' : '') + '<div style="white-space:pre-wrap">' + esc(out) + '</div>';
        $('gradeResult').classList.remove('hidden');
    } catch(e){ $('gradeResult').innerHTML = '⚠️ 連線失敗：' + e.message; $('gradeResult').classList.remove('hidden'); }
    $('gradeLoad').classList.add('hidden'); $('gradeLoad').classList.remove('flex');
    $('gradeBtn').disabled = false;
}

/* ---------- 題庫練習 ---------- */
function loadQuiz(){
    var ids = Object.keys(QUIZ_DATA || {});
    if (!ids.length) return alert('題庫未載入');
    var tid = ids[Math.floor(Math.random() * ids.length)];
    var t = QUIZ_DATA[tid];
    var qs = t.quiz || t.qs || [];
    if (!qs.length) return loadQuiz.retry = (loadQuiz.retry || 0) + 1 < 5 ? loadQuiz() : null;
    var q = qs[Math.floor(Math.random() * qs.length)];
    quizNow = { code: t.code, title: t.title, q: q.q, o: q.o, c: q.c };
    var labels = ['A','B','C','D'];
    var h = '<div class="mb-2"><span class="topic-tag">'+esc(t.code)+'</span> <span class="text-xs text-slate-400">'+esc(t.title)+'</span></div><p class="font-bold mb-2">'+esc(q.q)+'</p><div class="space-y-2">';
    q.o.forEach(function(o,i){ h += '<button onclick="pickQuiz('+i+')" class="w-full text-left p-3 rounded-xl border text-sm font-bold hover:bg-indigo-50">'+labels[i]+'. '+esc(o)+'</button>'; });
    h += '</div>';
    $('quizCard').innerHTML = h;
    $('quizResult').classList.add('hidden');
}
async function pickQuiz(sel){
    if (!quizNow) return;
    document.querySelectorAll('#quizCard button').forEach(function(b,i){ b.disabled = true; if (i === quizNow.c) b.classList.add('bg-green-100','border-green-500'); else if (i === sel) b.classList.add('bg-red-100','border-red-500'); });
    $('quizLoading').classList.remove('hidden'); $('quizLoading').classList.add('flex');
    var sn = searchNotes(quizNow.q);
    var msgs = [
      { role: 'system', content: '你係 BAFS 補習老師，解釋一題 MC 為何答錯/啱。【鐵則】所有 BAFS 概念/定義必須逐字引用【筆記內容】原文；筆記冇就直講「筆記冇教」。口語化粵語，短答。' },
      { role: 'user', content: (sn.ctx ? '【筆記內容】\n' + sn.ctx + '\n\n' : '') + '【題目】'+quizNow.q+'\n【正確】'+quizNow.o[quizNow.c]+'\n【學生揀】'+(quizNow.o[sel]||'') }
    ];
    try {
        var res = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+API_KEY }, body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.3, max_tokens: 1500 }) });
        var data = await res.json();
        var fb = data.choices[0].message.content || '正確答案：' + quizNow.c;
        $('quizResult').innerHTML = '<div style="white-space:pre-wrap">' + esc(fb) + '</div>';
        $('quizResult').classList.remove('hidden');
    } catch(e){ $('quizResult').innerHTML = '⚠️ 連線失敗：' + e.message; $('quizResult').classList.remove('hidden'); }
    $('quizLoading').classList.add('hidden'); $('quizLoading').classList.remove('flex');
}
var quizNow = null;

/* ---------- 圖像 ---------- */
buildImgForm = function(){
    if ($('imgForm').dataset.done) return; $('imgForm').dataset.done = 1;
    var sel = '<label class="text-xs font-bold text-slate-500 mb-1 block">揀課題</label><select id="imgTopic" class="w-full px-3 py-2.5 rounded-xl border text-sm"><option value="">— 請選擇 —</option>';
    Object.keys(QUIZ_DATA || {}).forEach(function(tid){ var t = QUIZ_DATA[tid]; sel += '<option value="'+tid+'">['+t.code+'] '+t.title+'</option>'; });
    sel += '</select><label class="text-xs font-bold text-slate-500 mb-1 mt-2 block">額外指示（可選）</label><input id="imgPrompt" class="w-full px-3 py-2.5 rounded-xl border text-sm"><button onclick="doImage()" id="imgBtn" class="w-full bg-indigo-600 text-white font-black py-3 rounded-xl mt-3">🎨 生成資訊圖</button>';
    $('imgForm').innerHTML = sel;
};
async function doImage(){
    var tid = $('imgTopic').value;
    if (!tid) return alert('請揀課題');
    var t = QUIZ_DATA[tid]; extra = $('imgPrompt').value.trim();
    $('imgBtn').disabled = true; $('imgLoading').classList.remove('hidden'); $('imgLoading').classList.add('flex');
    var sn = searchNotes(t.title);
    var prompt = 'Traditional Chinese educational infographic about BAFS [' + t.code + '] ' + t.title + '. Key content: ' + sn.ctx.substring(0, 400) + (extra ? '. User request: ' + extra : '') + '. Style: clean, modern, deep blue+orange, readable Traditional Chinese text.';
    try {
        var res = await fetch(IMG_ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+API_KEY }, body: JSON.stringify({ model: IMG_MODEL, prompt: prompt, n:1, size:'1024x1024' }) });
        var data = await res.json();
        if (data.error) throw new Error(data.error.message || 'API 錯誤');
        var url = data.data && data.data[0] && data.data[0].url;
        if (!url) throw new Error('冇回傳圖片');
        $('imgResult').innerHTML = '<img src="'+esc(url)+'" class="w-full rounded-xl" onclick="window.open(this.src,\'_blank\')">';
    } catch(e){ $('imgResult').innerHTML = '<p class="text-red-500 text-sm">⚠️ ' + esc(e.message) + '</p>'; }
    $('imgLoading').classList.add('hidden'); $('imgLoading').classList.remove('flex');
    $('imgBtn').disabled = false;
}

/* ---------- 影片 ---------- */
buildVideoForm = function(){
    if ($('videoForm').dataset.done) return; $('videoForm').dataset.done = 1;
    var sel = '<label class="text-xs font-bold text-slate-500 mb-1 block">揀課題</label><select id="videoTopic" class="w-full px-3 py-2.5 rounded-xl border text-sm"><option value="">— 請選擇 —</option>';
    Object.keys(QUIZ_DATA || {}).forEach(function(tid){ var t = QUIZ_DATA[tid]; sel += '<option value="'+tid+'">['+t.code+'] '+t.title+'</option>'; });
    sel += '</select><label class="text-xs font-bold text-slate-500 mb-1 mt-2 block">額外指示（可選）</label><input id="videoPrompt" class="w-full px-3 py-2.5 rounded-xl border text-sm"><label class="text-xs font-bold text-slate-500 mb-1 mt-2 block">片長：<span id="vdLabel">5</span> 秒</label><input type="range" id="vd" min="5" max="15" value="5" step="5" class="w-full" oninput="document.getElementById(\'vdLabel\').textContent=this.value"><button onclick="doVideo()" id="videoBtn" class="w-full bg-purple-600 text-white font-black py-3 rounded-xl mt-3">🎬 生成影片</button>';
    $('videoForm').innerHTML = sel;
};
async function doVideo(){
    var tid = $('videoTopic').value;
    if (!tid) return alert('請揀課題');
    var t = QUIZ_DATA[tid]; extra = $('videoPrompt').value.trim();
    var dur = parseInt($('vd').value) || 5;
    $('videoBtn').disabled = true; $('videoLoading').classList.remove('hidden'); $('videoLoading').classList.add('flex');
    $('videoProgress').style.width = '5%';
    var sn = searchNotes(t.title);
    var prompt = 'Traditional Chinese educational animation about BAFS [' + t.code + '] ' + t.title + '. Key content: ' + sn.ctx.substring(0, 300) + (extra ? '. Style: ' + extra : '');
    try {
        var frames = {5: 121, 10: 241, 15: 361};
        var res = await fetch(VID_ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+API_KEY }, body: JSON.stringify({ model: VID_MODEL, prompt: prompt, height: 768, width: 1152, num_frames: frames[dur] || 121, frame_rate: 24 }) });
        var data = await res.json();
        var statusUrl = data.status_url || (data.data && data.data.status_url);
        if (!statusUrl) throw new Error('提交失敗');
        var url = '';
        for (var i = 0; i < 40; i++){
            await new Promise(function(r){ setTimeout(r, 5000); });
            $('videoStatus').textContent = '生成中...(' + Math.round(i*5+5) + 's)';
            $('videoProgress').style.width = Math.min(i*4+8, 90) + '%';
            var pr = await fetch(statusUrl, { headers:{ 'Authorization':'Bearer '+API_KEY } });
            var pd = await pr.json();
            var st = pd.status || (pd.data && pd.data.status);
            if (st === 'SUCCESS' || st === 'succeeded' || st === 'completed'){
                var ru = pd.response_url || (pd.data && pd.data.response_url);
                if (ru){ var rr = await fetch(ru, { headers:{ 'Authorization':'Bearer '+API_KEY } }); var rd = await rr.json(); url = (rd.data && rd.data.url) || rd.url; }
                url = url || (pd.data && pd.data.url) || pd.url;
                if (url) break;
            }
            if (st === 'FAILED' || st === 'failed') throw new Error('生成失敗');
        }
        if (!url) throw new Error('超時，稍後再試');
        $('videoResult').innerHTML = '<video src="'+esc(url)+'" controls class="w-full rounded-xl"></video><a href="'+esc(url)+'" target="_blank" class="text-xs text-indigo-600 font-bold">🔗 打開原片</a>';
        $('videoProgress').style.width = '100%';
        $('videoStatus').textContent = '✅ 完成！';
    } catch(e){ $('videoResult').innerHTML = '<p class="text-red-500 text-sm">⚠️ ' + esc(e.message) + '</p>'; }
    $('videoLoading').classList.add('hidden'); $('videoLoading').classList.remove('flex');
    $('videoBtn').disabled = false;
}

/* ---------- 啟動 ---------- */
paintMode();
buildGradeForm();
if (!restoreChat()) welcome();
if (typeof QUIZ_DATA === 'undefined' || !QUIZ_DATA) window.QUIZ_DATA = {};
</script>
